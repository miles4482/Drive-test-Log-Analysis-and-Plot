<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bogura Drive Test Web v1.56</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { margin: 0; height: 100%; font-family: "Segoe UI", Calibri, sans-serif; color: #1a1a1a; }
  #app { display: flex; flex-direction: column; height: 100%; }
  header {
    display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
    padding: 4px 10px; background: #1b4f72; color: #fff;
  }
  header h1 { font-size: 13px; margin: 0; font-weight: 650; letter-spacing: 0.01em; }
  header label { font-size: 11px; display: flex; align-items: center; gap: 4px; }
  header select, header button {
    font: inherit; color: #1a1a1a; background: #fff; border: 0; border-radius: 4px;
    padding: 2px 6px;
  }
  header .check input { width: 15px; height: 15px; margin: 0; accent-color: #0b3a58; }
  header button { cursor: pointer; }
  header input[type="search"] {
    font: inherit; color: #1a1a1a; background: #fff; border: 0; border-radius: 4px;
    padding: 4px 8px; width: 150px;
  }
  header button.on, .bar button.on { background: #F5C400; }
  .dropdown { position: relative; display: inline-block; }
  .layer-btn { min-width: 108px; text-align: left; cursor: pointer; }
  .dropdown .menu {
    position: absolute; top: calc(100% + 4px); left: 0; z-index: 2000;
    background: #fff; color: #1a1a1a; border-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,.28); padding: 6px 12px 8px; min-width: 148px;
  }
  .dropdown .menu label { color: #1a1a1a; padding: 4px 0; }
  .ruler-tag { background: transparent; border: 0; }
  .ruler-tag span {
    background: #fff; border: 1px solid #222; padding: 1px 5px;
    font: 600 12px "Segoe UI", Calibri, sans-serif;
  }
  #stage { flex: 1; min-height: 0; display: grid; background: #0b3a58; gap: 3px; }
  #stage.n1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  #stage.n2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
  #stage.n3 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr; }
  #stage.n4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .board { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #d5d8dc; }
  .board.second-row .bar {
    display: flex; font-size: 10px; padding: 1px 4px; gap: 2px 5px;
  }
  .board.second-row .bar > :not(.ctl-kpi):not(.ctl-mode):not(.ctl-band):not(.win) { display: none; }
  .board.second-row .bar select,
  .board.second-row .bar .layer-btn { padding: 0 3px; }
  .board.second-row .layer-btn { min-width: 64px; font-size: 10px; }
  .board.second-row .win { font-size: 10px; }
  .bar {
    position: relative; z-index: 5;
    display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center;
    padding: 2px 6px; background: #1b4f72; color: #fff; font-size: 11px;
  }
  .bar label { display: flex; align-items: center; gap: 4px; }
  .bar select, .bar button, .bar input[type="search"] {
    font: inherit; color: #1a1a1a; background: #fff; border: 0; border-radius: 4px;
    padding: 3px 6px;
  }
  .bar input[type="search"] { width: 92px; }
  .bar input.latlong { width: 132px; }
  .map-wrap { position: relative; flex: 1; min-height: 0; display: flex; }
  .info-panel {
    position: absolute; z-index: 30; top: 8px; right: 8px;
    background: #fff; color: #111; border: 1px solid #222;
    box-shadow: 0 1px 4px rgba(0,0,0,.28); font-size: 11px; min-width: 190px;
  }
  .info-panel[hidden] { display: none; }
  .info-panel header {
    display: flex; align-items: center; gap: 8px;
    padding: 2px 6px; background: #1b4f72; color: #fff; font-size: 11px;
  }
  .info-panel header button {
    margin-left: auto; background: transparent; color: #fff; border: 0;
    font: inherit; cursor: pointer; padding: 0 2px;
  }
  .info-panel table { border-collapse: collapse; width: 100%; }
  .info-panel th, .info-panel td { border: 1px solid #c5cdd4; padding: 1px 6px; text-align: left; }
  .info-panel th { background: #e7eef4; font-weight: 650; }
  .bar .check input { width: 14px; height: 14px; margin: 0; accent-color: #0b3a58; }
  .bar button { cursor: pointer; }
  .bar .win { font-weight: 650; }
  .bar .status { margin-left: auto; opacity: 0.92; }
  .map { position: relative; z-index: 1; flex: 1; min-height: 0; background: #d5d8dc; }
  .legend {
    background: #fff; border: 1px solid #000; padding: 6px 8px 4px; line-height: 1.3;
    font-size: 11px; box-shadow: 0 1px 4px rgba(0,0,0,.25);
  }
  .legend h2 { margin: 0 0 4px; font-size: 11px; }
  .legend div { display: flex; align-items: center; gap: 8px; margin: 2px 0; }
  .swatch { width: 14px; height: 14px; border: 1px solid #333; flex: 0 0 auto; }
  .leaflet-popup-content { margin: 10px 12px; font-size: 13px; line-height: 1.45; }
  .leaflet-popup-content b { display: inline-block; width: 112px; }
  #status { margin-left: auto; font-size: 11px; opacity: 0.9; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Bogura coverage v1.56</h1>
    <label>Windows
      <select id="split">
        <option value="1" selected>1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>
    </label>
    <button type="button" id="info">Info</button>
    <span id="status">Click a spot to mark it in every window. Info shows one table.</span>
  </header>
  <div id="stage" class="n1"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="coverage_data.js"></script>
<script>
const RSRP_COLORS = ["#008000", "#00FF00", "#FFFF00", "#FF6666", "#FF0000"];
const RSRP_LABELS = ["-95 to 0", "-110 to -95", "-115 to -110", "-120 to -115", "-150 to -120"];
const RSRP_THRESH = [-95, -110, -115, -120];
const RSRQ_COLORS = ["#00FF00", "#FFFF00", "#FF0000"];
const RSRQ_LABELS = ["-10 to 0", "-17 to -10", "-30 to -17"];
const RSRQ_THRESH = [-10, -17];

function formatNum(value) {
  if (value === null || value === undefined || value === "") return "";
  const n = Number(value);
  if (!Number.isFinite(n)) return "";
  return String(Math.round(n * 100) / 100);
}

function classify(value, thresholds) {
  if (value === null || value === undefined || Number.isNaN(value)) return -1;
  for (let i = 0; i < thresholds.length; i++) {
    if (value >= thresholds[i]) return i;
  }
  return thresholds.length;
}

function classifyRsrp(value) {
  if (value === null || value === undefined || Number.isNaN(value)) return -1;
  if (value >= -95) return 0;
  if (value >= -110) return 1;
  if (value > -115) return 2;
  if (value >= -120) return 3;
  return 4;
}

function esc(value) {
  return String(value).replace(/[&<>"']/g, function (ch) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch];
  });
}

function legendHtml(kpi, mode) {
  if (!kpi) return "";
  const labels = kpi === "RSRP" ? RSRP_LABELS : RSRQ_LABELS;
  const colors = kpi === "RSRP" ? RSRP_COLORS : RSRQ_COLORS;
  const modeText = mode === "idle" ? "Idle" : "Active";
  const rows = labels.map(function (label, i) {
    return '<div><span class="swatch" style="background:' + colors[i] + '"></span>' + label + "</div>";
  }).join("");
  return "<h2>" + modeText + " by " + kpi + "</h2>" + rows;
}

const SpotCanvas = L.Layer.extend({
  options: { padding: 0.5 },
  initialize: function (pack, kpi) {
    this.pack = pack;
    this.kpi = kpi;
  },
  onAdd: function (map) {
    this._map = map;
    this._canvas = L.DomUtil.create("canvas", "leaflet-zoom-animated");
    this._canvas.style.pointerEvents = "none";
    map.getPanes().overlayPane.appendChild(this._canvas);
    map.on("moveend", this._reset, this);
    map.on("zoomend", this._reset, this);
    map.on("viewreset", this._reset, this);
    map.on("zoomanim", this._onAnimZoom, this);
    map.on("click", this._onClick, this);
    this._reset();
  },
  onRemove: function (map) {
    L.DomUtil.remove(this._canvas);
    map.off("moveend", this._reset, this);
    map.off("zoomend", this._reset, this);
    map.off("viewreset", this._reset, this);
    map.off("zoomanim", this._onAnimZoom, this);
    map.off("click", this._onClick, this);
  },
  _radius: function () {
    const z = this._map.getZoom();
    if (z >= 16) return 7;
    if (z >= 14) return 5.5;
    if (z >= 12) return 4.5;
    return 3.6;
  },
  _reset: function () {
    const map = this._map;
    const pad = this.options.padding;
    const size = map.getSize();
    const min = map.containerPointToLayerPoint(size.multiplyBy(-pad)).round();
    const boundsSize = size.multiplyBy(1 + pad * 2).round();
    this._bounds = L.bounds(min, min.add(boundsSize));
    this._center = map.getCenter();
    this._zoom = map.getZoom();
    L.DomUtil.setPosition(this._canvas, min);
    const dpr = window.devicePixelRatio || 1;
    this._dpr = dpr;
    this._canvas.width = boundsSize.x * dpr;
    this._canvas.height = boundsSize.y * dpr;
    this._canvas.style.width = boundsSize.x + "px";
    this._canvas.style.height = boundsSize.y + "px";
    this._draw();
  },
  _onAnimZoom: function (ev) {
    const map = this._map;
    const scale = map.getZoomScale(ev.zoom, this._zoom);
    const position = L.DomUtil.getPosition(this._canvas);
    const viewHalf = map.getSize().multiplyBy(0.5 + this.options.padding);
    const currentCenter = map.project(this._center, ev.zoom);
    const destCenter = map.project(ev.center, ev.zoom);
    const centerOffset = destCenter.subtract(currentCenter);
    const topLeft = viewHalf.multiplyBy(-scale).add(position).add(viewHalf).subtract(centerOffset);
    L.DomUtil.setTransform(this._canvas, topLeft, scale);
  },
  _draw: function () {
    const map = this._map;
    const ctx = this._canvas.getContext("2d");
    const dpr = this._dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, this._canvas.width / dpr, this._canvas.height / dpr);
    const pack = this.pack;
    const kpi = this.kpi;
    const colors = kpi === "RSRP" ? RSRP_COLORS : RSRQ_COLORS;
    const values = kpi === "RSRP" ? pack.rsrp : pack.rsrq;
    const radius = this._radius();
    const origin = this._bounds.min;
    const buckets = colors.map(function () { return []; });
    const placed = [];
    for (let i = 0; i < pack.lon.length; i++) {
      const cls = kpi === "RSRP" ? classifyRsrp(values[i]) : classify(values[i], RSRQ_THRESH);
      if (cls < 0) continue;
      const p = map.latLngToLayerPoint([pack.lat[i], pack.lon[i]]);
      placed.push({ cls: cls, x: p.x - origin.x, y: p.y - origin.y });
      buckets[cls].push(placed.length - 1);
    }
    ctx.beginPath();
    for (let n = 0; n < placed.length; n++) {
      ctx.moveTo(placed[n].x + radius + 1.6, placed[n].y);
      ctx.arc(placed[n].x, placed[n].y, radius + 1.6, 0, Math.PI * 2);
    }
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    for (let cls = 0; cls < buckets.length; cls++) {
      const ids = buckets[cls];
      if (!ids.length) continue;
      ctx.beginPath();
      for (let k = 0; k < ids.length; k++) {
        const pt = placed[ids[k]];
        ctx.moveTo(pt.x + radius, pt.y);
        ctx.arc(pt.x, pt.y, radius, 0, Math.PI * 2);
      }
      ctx.fillStyle = colors[cls];
      ctx.fill();
    }
  },
  _grid: function () {
    if (this._index) return this._index;
    const pack = this.pack;
    const cell = 0.0015;
    const grid = new Map();
    for (let i = 0; i < pack.lon.length; i++) {
      const key = Math.floor(pack.lat[i] / cell) + "," + Math.floor(pack.lon[i] / cell);
      let bucket = grid.get(key);
      if (!bucket) {
        bucket = [];
        grid.set(key, bucket);
      }
      bucket.push(i);
    }
    this._index = { grid: grid, cell: cell };
    return this._index;
  },
  _onClick: function (ev) {
    const pack = this.pack;
    const index = this._grid();
    const gy = Math.floor(ev.latlng.lat / index.cell);
    const gx = Math.floor(ev.latlng.lng / index.cell);
    const click = this._map.latLngToContainerPoint(ev.latlng);
    const limit = this._radius() + 6;
    let best = -1;
    let bestD = limit;
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        const bucket = index.grid.get((gy + dy) + "," + (gx + dx));
        if (!bucket) continue;
        for (let k = 0; k < bucket.length; k++) {
          const i = bucket[k];
          const p = this._map.latLngToContainerPoint([pack.lat[i], pack.lon[i]]);
          const dist = Math.hypot(p.x - click.x, p.y - click.y);
          if (dist <= bestD) {
            bestD = dist;
            best = i;
          }
        }
      }
    }
    if (best < 0 || (this.rulerBusy && this.rulerBusy())) return;
    if (this.onSpot) this.onSpot(best, pack);
  }
});

const PieCanvas = L.Layer.extend({
  options: { padding: 0.5 },
  onAdd: function (map) {
    this._map = map;
    this._canvas = L.DomUtil.create("canvas", "leaflet-zoom-animated");
    this._canvas.style.pointerEvents = "none";
    map.getPanes().overlayPane.appendChild(this._canvas);
    map.on("moveend", this._reset, this);
    map.on("zoomend", this._reset, this);
    map.on("viewreset", this._reset, this);
    map.on("zoomanim", this._onAnimZoom, this);
    this._reset();
  },
  onRemove: function (map) {
    L.DomUtil.remove(this._canvas);
    map.off("moveend", this._reset, this);
    map.off("zoomend", this._reset, this);
    map.off("viewreset", this._reset, this);
    map.off("zoomanim", this._onAnimZoom, this);
  },
  bringFront: function () {
    if (this._canvas && this._canvas.parentNode) this._canvas.parentNode.appendChild(this._canvas);
  },
  _reset: function () {
    const map = this._map;
    const pad = this.options.padding;
    const size = map.getSize();
    const min = map.containerPointToLayerPoint(size.multiplyBy(-pad)).round();
    const boundsSize = size.multiplyBy(1 + pad * 2).round();
    this._bounds = L.bounds(min, min.add(boundsSize));
    this._center = map.getCenter();
    this._zoom = map.getZoom();
    L.DomUtil.setPosition(this._canvas, min);
    const dpr = window.devicePixelRatio || 1;
    this._dpr = dpr;
    this._canvas.width = boundsSize.x * dpr;
    this._canvas.height = boundsSize.y * dpr;
    this._canvas.style.width = boundsSize.x + "px";
    this._canvas.style.height = boundsSize.y + "px";
    this._draw();
  },
  _onAnimZoom: function (ev) {
    const map = this._map;
    const scale = map.getZoomScale(ev.zoom, this._zoom);
    const position = L.DomUtil.getPosition(this._canvas);
    const viewHalf = map.getSize().multiplyBy(0.5 + this.options.padding);
    const currentCenter = map.project(this._center, ev.zoom);
    const destCenter = map.project(ev.center, ev.zoom);
    const centerOffset = destCenter.subtract(currentCenter);
    const topLeft = viewHalf.multiplyBy(-scale).add(position).add(viewHalf).subtract(centerOffset);
    L.DomUtil.setTransform(this._canvas, topLeft, scale);
  },
  _armKm: function () {
    const map = this._map;
    const lat = map.getCenter().lat * Math.PI / 180;
    const metresPerPx = 156543.03392 * Math.cos(lat) / Math.pow(2, map.getZoom());
    return Math.max(0.28, Math.min((48 * metresPerPx) / 1000, 1.05));
  },
  _draw: function () {
    const sites = COVERAGE.sites || [];
    const map = this._map;
    const ctx = this._canvas.getContext("2d");
    const dpr = this._dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, this._canvas.width / dpr, this._canvas.height / dpr);
    if (!sites.length) return;
    const origin = this._bounds.min;
    const bounds = map.getBounds();
    const km = this._armKm();
    const showNames = this.showSector !== false;
    const showSites = this.showSite !== false;
    ctx.lineCap = "round";
    ctx.font = "9px Segoe UI, Calibri, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const labels = [];
    const siteLabels = [];
    for (let s = 0; s < sites.length; s++) {
      const lat = sites[s][0];
      const lon = sites[s][1];
      if (!bounds.contains([lat, lon])) continue;
      const siteName = sites[s][2] || "";
      const arms = sites[s][3] || [];
      const centre = map.latLngToLayerPoint([lat, lon]);
      const cx = centre.x - origin.x;
      const cy = centre.y - origin.y;
      if (showSites && siteName) siteLabels.push([cx, cy - 10, siteName]);
      for (let a = 0; a < arms.length; a++) {
        const az = arms[a][1] * Math.PI / 180;
        const tip = map.latLngToLayerPoint(offsetKm(lat, lon, arms[a][1], km));
        const x = tip.x - origin.x;
        const y = tip.y - origin.y;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(x, y);
        ctx.strokeStyle = "#08343A";
        ctx.lineWidth = 4.2;
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(x, y);
        ctx.strokeStyle = "#00E5EE";
        ctx.lineWidth = 2.3;
        ctx.stroke();
        if (showNames && arms[a][0]) {
          const nameAt = map.latLngToLayerPoint(offsetKm(lat, lon, arms[a][1], km * 1.28));
          labels.push([nameAt.x - origin.x, nameAt.y - origin.y, arms[a][0]]);
        }
      }
    }
    paintLabels(ctx, labels, "11px Segoe UI, Calibri, sans-serif", "#FFFFFF", false);
    paintLabels(ctx, siteLabels, "8px Segoe UI, Calibri, sans-serif", "#7A1F6D", true);
  }
});

function paintLabels(ctx, items, font, color, halo) {
  if (!items.length) return;
  ctx.font = font;
  ctx.fillStyle = color;
  ctx.lineWidth = 2;
  ctx.strokeStyle = "#ffffff";
  for (let i = 0; i < items.length; i++) {
    const x = items[i][0];
    const y = items[i][1];
    const text = items[i][2];
    if (halo !== false) ctx.strokeText(text, x, y);
    ctx.fillText(text, x, y);
  }
}

function offsetKm(lat, lon, azimuthDeg, km) {
  const az = azimuthDeg * Math.PI / 180;
  const dlat = (km / 111.32) * Math.cos(az);
  const dlon = (km / (111.32 * Math.cos(lat * Math.PI / 180))) * Math.sin(az);
  return [lat + dlat, lon + dlon];
}

const BANDS = ["L900", "L1800", "L2100", "L2600"];
const PICK_METRES = 150;
const views = [];
let syncingView = false;

function metresBetween(a, b) {
  const r = 6371000;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLon = (b.lng - a.lng) * Math.PI / 180;
  const lat1 = a.lat * Math.PI / 180;
  const lat2 = b.lat * Math.PI / 180;
  const h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
  return 2 * r * Math.asin(Math.min(1, Math.sqrt(h)));
}

function metreLabel(metres) {
  return Math.round(metres).toLocaleString() + " m";
}

function emptyPack() {
  return { lon: [], lat: [], rsrp: [], rsrq: [], cell: [], name: [] };
}

function combinePacks(packs) {
  const points = [];
  packs.forEach(function (pack) {
    if (!pack) return;
    for (let i = 0; i < pack.lon.length; i++) {
      points.push({
        lon: pack.lon[i], lat: pack.lat[i], rsrp: pack.rsrp[i], rsrq: pack.rsrq[i],
        cell: pack.cell[i], name: pack.name[i]
      });
    }
  });
  if (!points.length) return emptyPack();
  let latSum = 0;
  for (let i = 0; i < points.length; i++) latSum += points[i].lat;
  const ref = Math.round((latSum / points.length) * 10) / 10;
  const dlat = 0.05 / 111.32;
  const dlon = 0.05 / (111.32 * Math.cos(ref * Math.PI / 180));
  const bins = new Map();
  points.forEach(function (point) {
    const key = Math.floor(point.lat / dlat) + "," + Math.floor(point.lon / dlon);
    const prev = bins.get(key);
    const score = point.rsrp === null ? -9999 : point.rsrp;
    const prevScore = !prev || prev.rsrp === null ? -9999 : prev.rsrp;
    if (!prev || score > prevScore) bins.set(key, point);
  });
  const out = emptyPack();
  bins.forEach(function (point) {
    out.lon.push(point.lon);
    out.lat.push(point.lat);
    out.rsrp.push(point.rsrp);
    out.rsrq.push(point.rsrq);
    out.cell.push(point.cell);
    out.name.push(point.name);
  });
  return out;
}

let infoOn = false;

function bandwidthText(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return "";
  if (Math.abs(n) >= 1000) return String(Math.round(n / 1000)) + " MHz";
  return formatNum(n) + " MHz";
}

function spotRows(pack, index) {
  const cell = pack.cell[index] === null || pack.cell[index] === undefined ? "" : String(pack.cell[index]);
  const nameId = pack.name[index] || 0;
  const name = (typeof COVERAGE === "undefined" ? "" : (COVERAGE.names[nameId] || ""));
  const rf = (typeof COVERAGE === "undefined" ? null : (COVERAGE.cells || [])[nameId]) || [null, null, null, null, null, null, null, null];
  const rsrp = pack.rsrp[index] === null || pack.rsrp[index] === undefined ? "" : pack.rsrp[index].toFixed(1) + " dBm";
  const rsrq = pack.rsrq[index] === null || pack.rsrq[index] === undefined ? "" : pack.rsrq[index].toFixed(1) + " dB";
  return [
    ["CellID", cell],
    ["CellName", name],
    ["Azimuth", formatNum(rf[0])],
    ["Height", formatNum(rf[1])],
    ["E_tilt", formatNum(rf[2])],
    ["M_tilt", formatNum(rf[3])],
    ["BW", bandwidthText(rf[5])],
    ["Tx", formatNum(rf[6])],
    ["Rx", formatNum(rf[7])],
    ["RS Power(dBm)", formatNum(rf[4])],
    ["RSRP", rsrp],
    ["RSRQ", rsrq]
  ];
}

function infoTable(rows) {
  const body = rows.map(function (row) {
    return "<tr><td>" + esc(row[0]) + "</td><td>" + esc(row[1]) + "</td></tr>";
  }).join("");
  return "<header>Identify <button type=\"button\" class=\"info-close\" aria-label=\"Close\">×</button></header>" +
    "<table><tr><th>Field</th><th>Value</th></tr>" + body + "</table>";
}

function nearestIndex(pack, latlng, maxMetres) {
  if (!pack || !pack.lon.length) return -1;
  let best = -1;
  let bestD = maxMetres;
  for (let i = 0; i < pack.lon.length; i++) {
    const dist = metresBetween(latlng, { lat: pack.lat[i], lng: pack.lon[i] });
    if (dist <= bestD) {
      bestD = dist;
      best = i;
    }
  }
  return best;
}

function findSites(query) {
  const exact = [];
  const partial = [];
  (typeof COVERAGE === "undefined" ? [] : (COVERAGE.sites || [])).forEach(function (site) {
    const siteName = String(site[2] || "");
    const sectors = (site[3] || []).map(function (arm) { return String(arm[0] || ""); });
    const exactHit = siteName.toLowerCase() === query || sectors.some(function (name) { return name.toLowerCase() === query; });
    const partialHit = siteName.toLowerCase().indexOf(query) >= 0 || sectors.some(function (name) { return name.toLowerCase().indexOf(query) >= 0; });
    if (exactHit) exact.push(site);
    else if (partialHit) partial.push(site);
  });
  return exact.length ? exact : partial;
}

function broadcastView(source) {
  if (syncingView || views.length < 2) return;
  syncingView = true;
  const center = source.map.getCenter();
  const zoom = source.map.getZoom();
  views.forEach(function (view) {
    if (view === source) return;
    const other = view.map.getCenter();
    if (view.map.getZoom() === zoom && center.distanceTo(other) < 0.5) return;
    view.map.setView(center, zoom, { animate: false });
  });
  syncingView = false;
}

let sharedPin = null;
function shareSpot(latlng) {
  sharedPin = latlng;
  views.forEach(function (view) { view.markSpot(latlng); });
}

function boardHtml(number) {
  return '<div class="bar">' +
    '<span class="win">Window ' + number + '</span>' +
    '<label class="ctl-kpi">KPI <select class="kpi"><option value="">Blank</option><option value="RSRP" selected>RSRP</option><option value="RSRQ">RSRQ</option></select></label>' +
    '<label class="ctl-mode">Mode <select class="mode"><option value="idle">Idle</option><option value="active">Active</option></select></label>' +
    '<label class="ctl-band"><span class="layer-name">Layer</span> <span class="dropdown">' +
      '<button type="button" class="layer-btn" aria-haspopup="listbox" aria-expanded="false">All bands</button>' +
      '<div class="menu" hidden>' +
        '<label class="check"><input type="checkbox" class="band" value="L900" checked> L900</label>' +
        '<label class="check"><input type="checkbox" class="band" value="L1800" checked> L1800</label>' +
        '<label class="check"><input type="checkbox" class="band" value="L2100" checked> L2100</label>' +
        '<label class="check"><input type="checkbox" class="band" value="L2600" checked> L2600</label>' +
      '</div></span></label>' +
    '<label class="check"><input type="checkbox" class="pies" checked> Pie</label>' +
    '<label class="check"><input type="checkbox" class="levels" checked> Sector</label>' +
    '<label class="check"><input type="checkbox" class="sitenames" checked> Site</label>' +
    '<button type="button" class="ruler">Ruler</button>' +
    '<button type="button" class="fit">Fit route</button>' +
    '<input class="q" type="search" placeholder="Site or sector" aria-label="Site or sector">' +
    '<button type="button" class="search">Search</button>' +
    '<input class="latlong" type="search" placeholder="Lat, long" aria-label="Latitude, longitude">' +
    '<button type="button" class="latlong-go">Lat-long</button>' +
    '<span class="status"></span>' +
    '</div><div class="map-wrap"><div class="map"></div><div class="info-panel" hidden></div></div>';
}

function createView(host, preset) {
  host.innerHTML = boardHtml(views.length + 1);
  const q = function (sel) { return host.querySelector(sel); };
  const map = L.map(q(".map"), { zoomControl: true, worldCopyJump: false });
  L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    { attribution: "Satellite © Esri", maxZoom: 19 }
  ).addTo(map);
  const legend = L.control({ position: "topleft" });
  let legendDiv = null;
  legend.onAdd = function () {
    legendDiv = L.DomUtil.create("div", "legend");
    L.DomEvent.disableClickPropagation(legendDiv);
    return legendDiv;
  };
  legend.addTo(map);

  let spots = null;
  let pies = null;
  let pinned = null;
  const pickLayer = L.layerGroup().addTo(map);
  const searchLayer = L.layerGroup().addTo(map);

  let rulerOn = false;
  let rulerPts = [];
  let rulerCursor = null;
  const rulerGroup = L.layerGroup().addTo(map);
  let rulerChains = [];
  let rulerTimes = [];
  let rulerIgnoreDbl = false;
  let rulerInClick = false;
  let rulerSwallowClick = false;
  let rulerFinishedAt = 0;
  let rulerFrame = 0;
  map.getContainer().addEventListener("click", function () { rulerInClick = true; }, true);
  map.getContainer().addEventListener("click", function () { rulerInClick = false; }, false);

  function setStatus(text) { q(".status").textContent = text; }
  function selectedBands() {
    return Array.prototype.map.call(host.querySelectorAll(".band:checked"), function (box) { return box.value; });
  }
  function layerSummary() {
    const bands = selectedBands();
    if (!bands.length) return "No band";
    if (bands.length === BANDS.length) return "All bands";
    return bands.join(" + ");
  }
  function currentPack() {
    if (typeof COVERAGE === "undefined") return emptyPack();
    const mode = q(".mode").value;
    const bands = selectedBands();
    if (!bands.length) return emptyPack();
    if (bands.length === BANDS.length) return COVERAGE.sets[mode + "|all"];
    if (bands.length === 1) return COVERAGE.sets[mode + "|" + bands[0]];
    return combinePacks(bands.map(function (band) { return COVERAGE.sets[mode + "|" + band]; }));
  }
  function sameSpot(a, b, pixels) {
    return map.latLngToContainerPoint(a).distanceTo(map.latLngToContainerPoint(b)) < (pixels || 8);
  }
  function clearRuler() {
    rulerPts = [];
    rulerTimes = [];
    rulerSwallowClick = false;
    rulerCursor = null;
    rulerGroup.clearLayers();
    rulerChains.forEach(function (chain) { map.removeLayer(chain.group); });
    rulerChains = [];
  }
  function drawRuler() {
    rulerGroup.clearLayers();
    const fixed = rulerPts.slice();
    fixed.forEach(function (point) {
      L.circleMarker(point, {
        radius: 6, color: "#8C6A32", weight: 2, fillColor: "#E6C48A", fillOpacity: 1, interactive: false
      }).addTo(rulerGroup);
    });
    const line = fixed.slice();
    if (rulerCursor && fixed.length) line.push(rulerCursor);
    if (line.length < 2) return;
    L.polyline(line, { color: "#E6C48A", weight: 3, interactive: false }).addTo(rulerGroup);
    const fixedParts = [];
    let fixedTotal = 0;
    for (let i = 1; i < fixed.length; i++) {
      const metres = metresBetween(fixed[i - 1], fixed[i]);
      fixedTotal += metres;
      fixedParts.push(metreLabel(metres));
    }
    for (let i = 1; i < line.length; i++) {
      const metres = metresBetween(line[i - 1], line[i]);
      const mid = L.latLng((line[i - 1].lat + line[i].lat) / 2, (line[i - 1].lng + line[i].lng) / 2);
      L.marker(mid, {
        interactive: false,
        icon: L.divIcon({
          className: "ruler-tag",
          html: "<span>" + metreLabel(metres) + "</span>",
          iconSize: [88, 18],
          iconAnchor: [44, 20]
        })
      }).addTo(rulerGroup);
    }
    if (fixedParts.length) setStatus("Ruler · " + fixedParts.join(" + ") + " · total " + metreLabel(fixedTotal));
  }
  function placeRulerPoint(latlng) {
    rulerPts.push(latlng);
    rulerTimes.push(Date.now());
    rulerCursor = null;
    drawRuler();
  }
  function finishRuler() {
    if (rulerPts.length < 2) {
      drawRuler();
      return;
    }
    const points = rulerPts.map(function (point) { return L.latLng(point.lat, point.lng); });
    const group = L.layerGroup().addTo(map);
    const chain = { group: group };
    function removeChain(ev) {
      rulerIgnoreDbl = true;
      if (ev && ev.originalEvent) L.DomEvent.stopPropagation(ev.originalEvent);
      map.removeLayer(group);
      rulerChains = rulerChains.filter(function (item) { return item !== chain; });
      setTimeout(function () { rulerIgnoreDbl = false; }, 0);
    }
    points.forEach(function (point) {
      const dot = L.circleMarker(point, {
        radius: 6, color: "#8C6A32", weight: 2, fillColor: "#E6C48A", fillOpacity: 1
      }).addTo(group);
      dot.on("click", function (ev) {
        if (ev.originalEvent) L.DomEvent.stopPropagation(ev.originalEvent);
      });
      dot.on("dblclick", removeChain);
    });
    const hit = L.polyline(points, { color: "#E6C48A", weight: 16, opacity: 0.01, interactive: true }).addTo(group);
    L.polyline(points, { color: "#E6C48A", weight: 3, interactive: false }).addTo(group);
    hit.on("click", function (ev) {
      if (ev.originalEvent) L.DomEvent.stopPropagation(ev.originalEvent);
    });
    hit.on("dblclick", removeChain);
    const parts = [];
    let total = 0;
    for (let i = 1; i < points.length; i++) {
      const metres = metresBetween(points[i - 1], points[i]);
      total += metres;
      parts.push(metreLabel(metres));
      const mid = L.latLng((points[i - 1].lat + points[i].lat) / 2, (points[i - 1].lng + points[i].lng) / 2);
      const label = L.marker(mid, {
        icon: L.divIcon({
          className: "ruler-tag",
          html: "<span>" + metreLabel(metres) + "</span>",
          iconSize: [88, 18],
          iconAnchor: [44, 20]
        })
      }).addTo(group);
      label.on("click", function (ev) {
        if (ev.originalEvent) L.DomEvent.stopPropagation(ev.originalEvent);
      });
      label.on("dblclick", removeChain);
    }
    rulerChains.push(chain);
    rulerPts = [];
    rulerTimes = [];
    rulerCursor = null;
    rulerGroup.clearLayers();
    setStatus("Ruler · " + parts.join(" + ") + " · total " + metreLabel(total));
  }
  function onMapClick(ev) {
    if (!rulerOn) return;
    if (rulerSwallowClick) {
      rulerSwallowClick = false;
      return;
    }
    placeRulerPoint(ev.latlng);
  }
  function onMapDblClick(ev) {
    if (!rulerOn) return;
    if (ev.originalEvent) L.DomEvent.stop(ev.originalEvent);
    if (rulerIgnoreDbl) {
      rulerIgnoreDbl = false;
      if (rulerInClick) rulerSwallowClick = true;
      return;
    }
    if (rulerPts.length === 0 && Date.now() - rulerFinishedAt < 400) return;
    const n = rulerPts.length;
    if (n >= 2 && Date.now() - rulerTimes[n - 2] < 800 && sameSpot(rulerPts[n - 2], rulerPts[n - 1], 6)) {
      rulerPts.pop();
      rulerTimes.pop();
    }
    const last = rulerPts[rulerPts.length - 1];
    if ((!last || !sameSpot(last, ev.latlng, 6)) && !rulerInClick) placeRulerPoint(ev.latlng);
    if (rulerInClick) rulerSwallowClick = true;
    rulerCursor = null;
    finishRuler();
    rulerFinishedAt = Date.now();
  }
  function onMapMove(ev) {
    if (!rulerOn || !rulerPts.length) return;
    rulerCursor = ev.latlng;
    if (rulerFrame) return;
    rulerFrame = requestAnimationFrame(function () {
      rulerFrame = 0;
      drawRuler();
    });
  }

  function renderPin() {
    pickLayer.clearLayers();
    if (!pinned) return;
    L.circleMarker(pinned, {
      radius: 8, color: "#111", weight: 2, fillColor: "#F5C400", fillOpacity: 1, className: "pick-pin"
    }).addTo(pickLayer);
  }
  function clearInfo() {
    const panel = q(".info-panel");
    panel.hidden = true;
    panel.innerHTML = "";
  }
  function showInfo(index, pack) {
    const panel = q(".info-panel");
    panel.innerHTML = infoTable(spotRows(pack, index));
    panel.hidden = false;
    panel.querySelector(".info-close").addEventListener("click", clearInfo);
  }

  function syncPies() {
    const on = q(".pies").checked;
    if (pies) {
      pies.showSector = q(".levels").checked;
      pies.showSite = q(".sitenames").checked;
    }
    if (on) {
      if (!pies) {
        pies = new PieCanvas();
        pies.showSector = q(".levels").checked;
        pies.showSite = q(".sitenames").checked;
        pies.addTo(map);
      } else {
        pies.bringFront();
        pies._reset();
      }
    } else if (pies) {
      map.removeLayer(pies);
      pies = null;
    }
  }

  function draw() {
    const kpi = q(".kpi").value;
    const mode = q(".mode").value;
    if (legendDiv) {
      legendDiv.innerHTML = legendHtml(kpi, mode);
      legendDiv.style.display = kpi ? "" : "none";
    }
    map.closePopup();
    if (spots) {
      map.removeLayer(spots);
      spots = null;
    }
    const pack = currentPack();
    if (!kpi) {
      setStatus("Map only");
      if (pinned) renderPin();
      if (pies) pies.bringFront();
      return;
    }
    if (!pack || !pack.lon.length) {
      setStatus("No samples on this layer");
      if (pinned) renderPin();
      return;
    }
    const values = kpi === "RSRP" ? pack.rsrp : pack.rsrq;
    const thresholds = kpi === "RSRP" ? RSRP_THRESH : RSRQ_THRESH;
    let shown = 0;
    for (let i = 0; i < values.length; i++) {
      if (classify(values[i], thresholds) >= 0) shown++;
    }
    spots = new SpotCanvas(pack, kpi);
    spots.rulerBusy = function () { return rulerOn; };
    spots.onSpot = function (index, spotPack) {
      shareSpot(L.latLng(spotPack.lat[index], spotPack.lon[index]));
      views.forEach(function (view) { view.clearInfo(); });
      if (infoOn) showInfo(index, spotPack);
    };
    spots.addTo(map);
    if (pies) pies.bringFront();
    const bands = selectedBands();
    const bandText = bands.length === BANDS.length ? "all bands" : (bands.join("+") || "no band");
    setStatus(shown.toLocaleString() + " spots · " + bandText + " · click a spot");
    if (pinned) renderPin();
  }

  function fit() {
    const pack = currentPack();
    if (!pack || !pack.lon.length) return;
    let latMin = Infinity, latMax = -Infinity, lonMin = Infinity, lonMax = -Infinity;
    for (let i = 0; i < pack.lon.length; i++) {
      const lat = pack.lat[i];
      const lon = pack.lon[i];
      if (lat < latMin) latMin = lat;
      if (lat > latMax) latMax = lat;
      if (lon < lonMin) lonMin = lon;
      if (lon > lonMax) lonMax = lon;
    }
    map.fitBounds([[latMin, lonMin], [latMax, lonMax]], { padding: [24, 24], animate: false });
  }

  function showSearch(hits, focus) {
    searchLayer.clearLayers();
    const bounds = [];
    hits.forEach(function (site) {
      const latlng = [site[0], site[1]];
      bounds.push(latlng);
      const sectors = (site[3] || []).map(function (arm) { return arm[0]; }).filter(Boolean).join(", ");
      const marker = L.circleMarker(latlng, {
        radius: 11, color: "#F5C400", weight: 3, fillColor: "#F5C400", fillOpacity: 0.35
      });
      marker.bindPopup("<div><b>Site</b> " + esc(site[2] || "") + "<br><b>Sector</b> " + esc(sectors) + "</div>", { autoPan: false });
      marker.addTo(searchLayer);
    });
    if (!focus) return;
    if (hits.length === 1) {
      map.setView(bounds[0], 16, { animate: false });
      searchLayer.eachLayer(function (marker) { marker.openPopup(); });
    } else {
      map.fitBounds(bounds, { padding: [36, 36], maxZoom: 15, animate: false });
    }
    setStatus(hits.length.toLocaleString() + " site match" + (hits.length === 1 ? "" : "es"));
  }

  function runSearch() {
    const raw = q(".q").value.trim();
    const query = raw.toLowerCase();
    if (!query) {
      views.forEach(function (view) { view.clearSearch(); });
      return;
    }
    const hits = findSites(query);
    if (!hits.length) {
      setStatus("No site or sector matches “" + raw + "”");
      views.forEach(function (view) { view.clearSearch(); });
      return;
    }
    const self = api;
    views.forEach(function (view) { view.showSearch(hits, view === self); });
  }

  function applyPreset(source) {
    if (!source) return;
    q(".kpi").value = source.kpi;
    q(".mode").value = source.mode;
    host.querySelectorAll(".band").forEach(function (box) {
      box.checked = source.bands.indexOf(box.value) >= 0;
    });
    q(".pies").checked = source.pies;
    q(".levels").checked = source.levels;
    q(".sitenames").checked = source.sites;
    q(".layer-btn").textContent = layerSummary();
  }

  q(".kpi").addEventListener("change", draw);
  q(".mode").addEventListener("change", draw);
  q(".layer-btn").addEventListener("click", function (ev) {
    ev.stopPropagation();
    const menu = q(".menu");
    const open = menu.hasAttribute("hidden");
    if (open) menu.removeAttribute("hidden");
    else menu.setAttribute("hidden", "");
    this.setAttribute("aria-expanded", open ? "true" : "false");
  });
  host.querySelectorAll(".band").forEach(function (box) {
    box.addEventListener("change", function () {
      q(".layer-btn").textContent = layerSummary();
      draw();
    });
  });
  q(".fit").addEventListener("click", fit);
  q(".pies").addEventListener("change", syncPies);
  q(".levels").addEventListener("change", syncPies);
  q(".sitenames").addEventListener("change", syncPies);
  q(".ruler").addEventListener("click", function () {
    rulerOn = !rulerOn;
    this.classList.toggle("on", rulerOn);
    if (rulerOn) map.doubleClickZoom.disable();
    else {
      map.doubleClickZoom.enable();
      clearRuler();
      draw();
    }
  });
  function showLatLong() {
    const box = q(".latlong");
    if (document.activeElement === box) return;
    const center = map.getCenter();
    box.value = center.lat.toFixed(5) + ", " + center.lng.toFixed(5);
  }
  function runLatLong() {
    const raw = q(".latlong").value.trim();
    const parts = raw.split(/[,\s]+/).filter(Boolean);
    const lat = parts.length >= 2 ? Number(parts[0]) : NaN;
    const lon = parts.length >= 2 ? Number(parts[1]) : NaN;
    if (!Number.isFinite(lat) || !Number.isFinite(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) {
      setStatus("Enter latitude, longitude");
      return;
    }
    map.setView([lat, lon], Math.max(map.getZoom(), 16), { animate: false });
    setStatus("Lat-long " + lat.toFixed(5) + ", " + lon.toFixed(5));
  }
  q(".search").addEventListener("click", runSearch);
  q(".q").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") runSearch();
  });
  q(".latlong-go").addEventListener("click", runLatLong);
  q(".latlong").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") runLatLong();
  });
  map.on("click", onMapClick);
  map.on("dblclick", onMapDblClick);
  map.on("mousemove", onMapMove);

  const api = {
    host: host,
    map: map,
    draw: draw,
    fit: fit,
    syncPies: syncPies,
    markSpot: function (latlng) {
      pinned = latlng;
      renderPin();
    },
    clearInfo: clearInfo,
    showInfo: showInfo,
    showSearch: showSearch,
    clearSearch: function () { searchLayer.clearLayers(); },
    snapshot: function () {
      return {
        kpi: q(".kpi").value,
        mode: q(".mode").value,
        bands: selectedBands(),
        pies: q(".pies").checked,
        levels: q(".levels").checked,
        sites: q(".sitenames").checked
      };
    },
    applyPreset: applyPreset,
    closeMenu: function (target) {
      const menu = q(".menu");
      if (menu.contains(target)) return;
      menu.setAttribute("hidden", "");
      q(".layer-btn").setAttribute("aria-expanded", "false");
    },
    destroy: function () {
      map.remove();
      host.remove();
    }
  };
  if (preset) applyPreset(preset);
  map.on("moveend", function () {
    showLatLong();
    broadcastView(api);
  });
  host.__view = api;
  return api;
}

function pageNote(count) {
  const status = document.getElementById("status");
  if (count === 1) status.textContent = "One window. Info shows a table for the spot you select.";
  else status.textContent = count + " windows. A spot is marked in every window. Info shows one table.";
}

function setSplit(count) {
  const stage = document.getElementById("stage");
  stage.className = "n" + count;
  const preset = views[0] ? views[0].snapshot() : null;
  const center = views[0] ? views[0].map.getCenter() : null;
  const zoom = views[0] ? views[0].map.getZoom() : null;
  while (views.length > count) views.pop().destroy();
  while (views.length < count) {
    const board = document.createElement("section");
    board.className = "board";
    stage.appendChild(board);
    const source = (views.length === 3 && views[1]) ? views[1].snapshot() : preset;
    views.push(createView(board, views.length ? source : null));
  }
  const across = count <= 3 ? count : 2;
  views.forEach(function (view, index) {
    const onSecond = index >= across;
    view.host.querySelector(".win").textContent = onSecond ? ("W" + (index + 1)) : ("Window " + (index + 1));
    view.host.querySelector(".layer-name").textContent = onSecond ? "Band" : "Layer";
    view.host.classList.toggle("second-row", onSecond);
  });
  pageNote(count);
  requestAnimationFrame(function () {
    syncingView = true;
    views.forEach(function (view, index) {
      view.map.invalidateSize();
      if (index > 0 && center) view.map.setView(center, zoom, { animate: false });
      if (index > 0) {
        view.draw();
        view.syncPies();
        if (sharedPin) view.markSpot(sharedPin);
      }
    });
    syncingView = false;
  });
}

document.getElementById("split").addEventListener("change", function () {
  setSplit(Number(this.value));
});
document.getElementById("info").addEventListener("click", function () {
  infoOn = !infoOn;
  this.classList.toggle("on", infoOn);
  if (!infoOn) views.forEach(function (view) { view.clearInfo(); });
});
document.addEventListener("click", function (ev) {
  views.forEach(function (view) { view.closeMenu(ev.target); });
});
window.addEventListener("resize", function () {
  views.forEach(function (view) { view.map.invalidateSize(); });
});

if (typeof COVERAGE === "undefined") {
  document.getElementById("status").textContent = "Coverage data was not found beside this page";
  setSplit(1);
} else {
  setSplit(1);
  requestAnimationFrame(function () {
    views[0].map.invalidateSize();
    views[0].draw();
    views[0].syncPies();
    views[0].fit();
  });
}
</script>
